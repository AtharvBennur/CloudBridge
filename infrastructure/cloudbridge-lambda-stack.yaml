AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudBridge real MySQL Lambda migration workers; deploy with sam build && sam deploy.
Parameters:
  CloudBridgeAPIURL: {Type: String}
  WorkerApiSecret: {Type: String, NoEcho: true}
  CloudBridgeControlPlaneAccountId: {Type: String}
  ExternalId: {Type: String, NoEcho: true}
Resources:
  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: migration_id, AttributeType: S}, {AttributeName: chunk_id, AttributeType: S}]
      KeySchema: [{AttributeName: migration_id, KeyType: HASH}, {AttributeName: chunk_id, KeyType: RANGE}]
      SSESpecification: {SSEEnabled: true}
  ChunkDLQ:
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  ChunkQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      RedrivePolicy: {deadLetterTargetArn: !GetAtt ChunkDLQ.Arn, maxReceiveCount: 3}
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query], Resource: !GetAtt MetadataTable.Arn}
              - {Effect: Allow, Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes], Resource: [!GetAtt ChunkQueue.Arn, !GetAtt ChunkDLQ.Arn]}
              - {Effect: Allow, Action: [secretsmanager:GetSecretValue], Resource: '*'}
  DependencyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties: {LayerName: cloudbridge-mysql-dependencies, ContentUri: lambda_layer/, CompatibleRuntimes: [python3.12]}
    Metadata: {BuildMethod: python3.12, BuildProperties: {RequirementsFile: requirements.txt}}
  Orchestrator:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudbridge-migration-orchestrator
      CodeUri: lambda_src/
      Handler: app.orchestrator_handler
      Runtime: python3.12
      Role: !GetAtt LambdaRole.Arn
      Timeout: 900
      MemorySize: 1024
      Layers: [!Ref DependencyLayer]
      Environment: {Variables: {MIGRATION_METADATA_TABLE: !Ref MetadataTable, CHUNK_QUEUE_URL: !Ref ChunkQueue, CLOUDBRIDGE_API_URL: !Ref CloudBridgeAPIURL, WORKER_API_SECRET: !Ref WorkerApiSecret}}
  Worker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudbridge-migration-worker
      CodeUri: lambda_src/
      Handler: app.worker_handler
      Runtime: python3.12
      Role: !GetAtt LambdaRole.Arn
      Timeout: 900
      MemorySize: 2048
      Layers: [!Ref DependencyLayer]
      Environment: {Variables: {MIGRATION_METADATA_TABLE: !Ref MetadataTable, CHUNK_QUEUE_URL: !Ref ChunkQueue, CLOUDBRIDGE_API_URL: !Ref CloudBridgeAPIURL, WORKER_API_SECRET: !Ref WorkerApiSecret}}
      Events: {Chunks: {Type: SQS, Properties: {Queue: !GetAtt ChunkQueue.Arn, BatchSize: 1}}}
  Validator:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudbridge-validation
      CodeUri: lambda_src/
      Handler: app.validation_handler
      Runtime: python3.12
      Role: !GetAtt LambdaRole.Arn
      Timeout: 120
      MemorySize: 512
      Layers: [!Ref DependencyLayer]
      Environment: {Variables: {MIGRATION_METADATA_TABLE: !Ref MetadataTable, CHUNK_QUEUE_URL: !Ref ChunkQueue, CLOUDBRIDGE_API_URL: !Ref CloudBridgeAPIURL, WORKER_API_SECRET: !Ref WorkerApiSecret}}
  CloudBridgeMigrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudBridgeMigrationRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {AWS: !Sub 'arn:aws:iam::${CloudBridgeControlPlaneAccountId}:root'}, Action: sts:AssumeRole, Condition: {StringEquals: {'sts:ExternalId': !Ref ExternalId}}}]
      Policies:
        - PolicyName: control-plane
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [lambda:InvokeFunction], Resource: [!GetAtt Orchestrator.Arn, !GetAtt Worker.Arn, !GetAtt Validator.Arn]}
              - {Effect: Allow, Action: [secretsmanager:CreateSecret, secretsmanager:PutSecretValue, secretsmanager:GetSecretValue, secretsmanager:DescribeSecret], Resource: '*'}
Outputs:
  MigrationRoleArn: {Value: !GetAtt CloudBridgeMigrationRole.Arn}
  MigrationOrchestratorLambdaArn: {Value: !GetAtt Orchestrator.Arn}
  MigrationWorkerLambdaArn: {Value: !GetAtt Worker.Arn}
  ValidationLambdaArn: {Value: !GetAtt Validator.Arn}
  MigrationMetadataTableName: {Value: !Ref MetadataTable}
  MigrationChunkQueueUrl: {Value: !Ref ChunkQueue}
