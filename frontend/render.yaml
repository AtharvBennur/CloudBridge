services:
  - type: web
    name: cloudbridge-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cloudbridge-2-a0fp.onrender.com
      - key: VITE_WS_BASE_URL
        value: wss://cloudbridge-2-a0fp.onrender.com
      - key: VITE_APP_NAME
        value: CloudBridge
      - key: VITE_APP_VERSION
        value: 1.0.0
      - key: VITE_DEBUG
        value: false
      - key: VITE_DEFAULT_THEME
        value: system
      - key: VITE_ENABLE_ANIMATIONS
        value: true
      - key: VITE_ENABLE_TELEMETRY
        value: false
      # Feature flags
      - key: VITE_FEATURE_CDC
        value: true
      - key: VITE_FEATURE_SCHEMA_DRIFT
        value: true
      - key: VITE_FEATURE_APPROVALS
        value: true
      - key: VITE_FEATURE_ECS
        value: true
      - key: VITE_FEATURE_OBSERVABILITY
        value: true
      - key: VITE_FEATURE_NOTIFICATIONS
        value: true
      - key: VITE_FEATURE_ROLLBACK
        value: true