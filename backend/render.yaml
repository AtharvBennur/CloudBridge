services:
  - type: web
    name: cloudbridge-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT --timeout 300 wsgi:app
    envVars:
      - key: API_BASE_URL
        value: https://cloudbridge-2-a0fp.onrender.com
      - key: API_HOST
        value: cloudbridge-2-a0fp.onrender.com
      - key: API_PORT
        value: 443
      - key: API_PROTOCOL
        value: https
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: CLOUDBRIDGE_AWS_ACCOUNT_ID
        sync: false
      - key: COGNITO_REGION
        sync: false
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: COGNITO_IDENTITY_POOL_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://cloudbridge-2-a0fp.onrender.com,http://localhost:5173,http://localhost:5174
      - key: LOG_LEVEL
        value: INFO
      - key: ECS_CLUSTER_NAME
        value: cloudbridge-migration-cluster
      - key: CLOUDWATCH_LOG_GROUP
        value: /aws/ecs/cloudbridge-migration-workers
      - key: SECRET_KEY
        sync: false
      - key: WORKER_API_SECRET
        sync: false
databases:
  - name: cloudbridge-db
    databaseName: cloudbridge
    user: cloudbridge